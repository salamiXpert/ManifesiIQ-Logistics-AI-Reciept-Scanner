<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B3B5C"/>
    </linearGradient>
  </defs>

  <!-- Icon: cargo box holding a scanned document -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#g)"/>

    <!-- document -->
    <rect x="30" y="20" width="60" height="76" rx="6" fill="#FFFFFF"/>
    <rect x="38" y="32" width="30" height="5" rx="2.5" fill="#0F766E"/>
    <rect x="38" y="44" width="44" height="4" rx="2" fill="#9CA3AF"/>
    <rect x="38" y="54" width="44" height="4" rx="2" fill="#9CA3AF"/>
    <rect x="38" y="64" width="32" height="4" rx="2" fill="#9CA3AF"/>

    <!-- scan beam -->
    <rect x="22" y="72" width="76" height="5" rx="2.5" fill="#F59E0B"/>

    <g transform="translate(0,-7)">
    <path d="M60 84 L88 94 L88 112 L60 122 L32 112 L32 94 Z" fill="#F59E0B" stroke="#0B3B5C" stroke-width="3" stroke-linejoin="round"/>
    <path d="M32 94 L60 104 L88 94" fill="none" stroke="#0B3B5C" stroke-width="3" stroke-linejoin="round"/>
    <path d="M60 104 L60 122" stroke="#0B3B5C" stroke-width="3"/>
    </g>

    <!-- AI sparkle -->
    <path d="M96 14 L99 23 L108 26 L99 29 L96 38 L93 29 L84 26 L93 23 Z" fill="#FDE68A"/>
  </g>

  <!-- Wordmark -->
  <text x="152" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#0B3B5C">Manifest<tspan fill="#0F766E">IQ</tspan></text>
  <text x="154" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#4B5563" letter-spacing="0.5">Scan. Extract. Ship smarter.</text>
</svg>
